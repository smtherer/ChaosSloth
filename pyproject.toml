[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chaossloth"
version = "0.1.0"
description = "Autonomous Bayesian Concurrency Interleaver and Deterministic Race-Condition Exorcist"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "rich>=13.0.0",
    "pytest>=7.0.0",
    "numpy>=1.23.0",
    "pandas>=2.0.0",
    "tabpfn>=0.1.10",
    "requests>=2.28.0",
]

[project.scripts]
chaossloth = "chaossloth.cli:main"

[project.entry-points.pytest11]
chaossloth = "chaossloth.pytest_plugin.plugin"
